<!DOCTYPE html>
<html>
<head>
    <title>API Connection Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    <div id="result"></div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing API connection...</p>';
            
            try {
                console.log('Testing API URL:', API_URL);
                const response = await fetch(`${API_URL}/api/`);
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                resultDiv.innerHTML = `
                    <h2>✅ API Connection Successful!</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p>Backend is running and responding correctly.</p>
                `;
            } catch (error) {
                console.error('API Error:', error);
                resultDiv.innerHTML = `
                    <h2>❌ API Connection Failed</h2>
                    <p>Error: ${error.message}</p>
                    <p>Make sure the Django backend is running on port 8000</p>
                    <p>Check browser console for more details</p>
                `;
            }
        }
        
        // Run test on page load
        testAPI();
    </script>
</body>
</html>
